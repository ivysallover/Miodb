name: App de escritorio

# Arma el instalador de Windows (.exe) en GitHub. El de Mac con Apple Silicon se arma en la Mac
# (`npm run instalador:mac`: lo arma y lo suma a la versión); el de Mac con Intel, solo a pedido.
#
# Se corre a mano desde Actions → "App de escritorio" → Run workflow, en la rama `escritorio`:
#   - sin marcar nada, es una prueba: arma y deja el instalador para bajar en Artifacts, sin crear versión;
#   - con "Publicar", crea el borrador de la versión que dice desktop/src-tauri/tauri.conf.json (etiqueta
#     escritorio-vX.Y.Z), con lo que usa la actualización automática (latest.json y la firma). Los
#     usuarios la reciben recién cuando el borrador se publica.
# Correrlo en la rama, y no al subir una etiqueta, deja usar lo ya compilado en los armados anteriores de
# la rama (una etiqueta solo ve la caché de main): Rust recompila solo lo que cambió.
#
# Necesita el secreto TAURI_SIGNING_PRIVATE_KEY: la clave de ~/.tauri/mio-escritorio.key (ver DEPLOY.md).

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar: crear el borrador de la versión de tauri.conf.json'
        type: boolean
        default: false
      intel:
        description: 'Armar también Mac con Intel (a pedido)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  instalador:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.intel && '["windows-latest", "macos-15-intel"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # En Windows, el armado de LightGBM copia carpetas con un comando que lee la "/" de
      # desktop/target.nosync como una opción: ahí la carpeta de armado va con barras de Windows.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CARGO_TARGET_DIR=$env:GITHUB_WORKSPACE\desktop\target" >> $env:GITHUB_ENV
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop -> ${{ runner.os == 'Windows' && 'target' || 'target.nosync' }}
      - run: npm ci
      - run: npx vite build
      # Lo que trae esta versión (desktop/novedades.md): va en la página de la versión y lo muestra la
      # app en "Versión nueva".
      - id: notas
        shell: bash
        run: |
          { echo 'texto<<FIN_NOVEDADES'; cat desktop/novedades.md; echo 'FIN_NOVEDADES'; } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: desktop/src-tauri
          tauriScript: npx tauri
          # Sin "Publicar" solo arma: no crea etiqueta ni versión.
          tagName: ${{ inputs.publicar && 'escritorio-v__VERSION__' || '' }}
          releaseCommitish: ${{ github.sha }}
          releaseName: MIO para escritorio __VERSION__
          releaseBody: ${{ steps.notas.outputs.texto }}
          releaseDraft: true
      - if: ${{ !inputs.publicar }}
        uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: |
            desktop/target*/release/bundle/dmg/*.dmg
            desktop/target*/release/bundle/nsis/*.exe
          if-no-files-found: error
