name: App de escritorio

# Arma en GitHub el instalador de Windows (.exe); las Mac, a pedido. La de Apple Silicon conviene armarla en
# la Mac (`npm run instalador:mac`, que la suma al mismo borrador): GitHub casi nunca tiene esas máquinas libres.
#
# Se corre a mano desde Actions → "App de escritorio" → Run workflow, en la rama `escritorio`:
#   - sin marcar nada, es una prueba: arma y deja el instalador para bajar en Artifacts, sin crear versión;
#   - con "Publicar", crea el borrador de la versión que dice desktop/src-tauri/tauri.conf.json (etiqueta
#     escritorio-vX.Y.Z), con lo que usa la actualización automática (latest.json y la firma). Los
#     usuarios la reciben recién cuando el borrador se publica.
# Correrlo en la rama, y no al subir una etiqueta, deja usar lo ya compilado en los armados anteriores de
# la rama (una etiqueta solo ve la caché de main): Rust recompila solo lo que cambió.
#
# Necesita el secreto TAURI_SIGNING_PRIVATE_KEY: la clave de ~/.tauri/mio-escritorio.key (ver DEPLOY.md).

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar: crear el borrador de la versión de tauri.conf.json'
        type: boolean
        default: false
      mac:
        description: 'Armar también Mac con Apple Silicon (GitHub suele no tener máquinas libres: si no arranca, npm run instalador:mac)'
        type: boolean
        default: false
      intel:
        description: 'Armar también Mac con Intel (a pedido)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Con "Publicar", el borrador de la versión se crea una sola vez antes de armar: así Windows y Mac, que
  # se arman a la vez, suben al mismo borrador en lugar de crear uno cada uno.
  borrador:
    if: ${{ inputs.publicar }}
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.crear.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: crear
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          TAG="escritorio-v$V"
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "MIO para escritorio $V" --notes-file desktop/novedades.md
          echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)" >> "$GITHUB_OUTPUT"

  instalador:
    needs: borrador
    # Sin "Publicar" no hay borrador (se saltea) y se arma igual.
    if: ${{ always() && needs.borrador.result != 'failure' && needs.borrador.result != 'cancelled' }}
    strategy:
      fail-fast: false
      matrix:
        # Windows siempre; las Mac, según lo marcado (macos-15 es Apple Silicon).
        os: ${{ fromJSON(format('["windows-latest"{0}{1}]', inputs.mac && ', "macos-15"' || '', inputs.intel && ', "macos-15-intel"' || '')) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # Rust fijo: desde la 1.100 las carpetas de armado llevan una "/" que rompe el armado de LightGBM en
      # Windows (lo copia con un comando que la lee como una opción). Subirlo cuando lightgbm3-sys lo arregle.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      # En Windows, el armado de LightGBM copia carpetas con un comando que lee la "/" de
      # desktop/target.nosync como una opción: ahí la carpeta de armado va con barras de Windows.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CARGO_TARGET_DIR=$env:GITHUB_WORKSPACE\desktop\target" >> $env:GITHUB_ENV
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop -> ${{ runner.os == 'Windows' && 'target' || 'target.nosync' }}
      - run: npm ci
      - run: npx vite build
      # Lo que trae esta versión (desktop/novedades.md): va en la página de la versión y lo muestra la
      # app en "Versión nueva".
      - id: notas
        shell: bash
        run: |
          { echo 'texto<<FIN_NOVEDADES'; cat desktop/novedades.md; echo 'FIN_NOVEDADES'; } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: desktop/src-tauri
          tauriScript: npx tauri
          # Sin "Publicar" solo arma: no crea etiqueta ni versión.
          tagName: ${{ inputs.publicar && 'escritorio-v__VERSION__' || '' }}
          releaseId: ${{ needs.borrador.outputs.id }}
          releaseCommitish: ${{ github.sha }}
          releaseName: MIO para escritorio __VERSION__
          releaseBody: ${{ steps.notas.outputs.texto }}
          releaseDraft: true
      - if: ${{ !inputs.publicar }}
        uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: |
            desktop/target*/release/bundle/dmg/*.dmg
            desktop/target*/release/bundle/nsis/*.exe
          if-no-files-found: error
