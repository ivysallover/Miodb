name: App de escritorio

# Arma los instaladores de la app (Mac con Apple Silicon y con Intel: .dmg; Windows: .exe) y
# los deja en un borrador de versión en GitHub, con lo que usa la actualización automática (latest.json
# y la firma de cada instalador). Corre al subir una etiqueta escritorio-v* (por ejemplo
# escritorio-v0.2.0, con la misma versión en desktop/src-tauri/tauri.conf.json). Los usuarios reciben la
# versión recién cuando el borrador se publica.
#
# Para probar sin gastar un número de versión: correrlo a mano desde Actions (Run workflow, en la rama
# que sea). Arma los mismos instaladores pero no crea versión ni etiqueta: quedan para bajar en la
# página del armado (Artifacts). La etiqueta se sube recién cuando ese armado sale bien en las tres.
#
# Necesita el secreto TAURI_SIGNING_PRIVATE_KEY: la clave de ~/.tauri/mio-escritorio.key (ver DEPLOY.md).

on:
  push:
    tags: ['escritorio-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # En Windows, el armado de LightGBM copia carpetas con un comando que lee la "/" de
      # desktop/target.nosync como una opción: ahí la carpeta de armado va con barras de Windows.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CARGO_TARGET_DIR=$env:GITHUB_WORKSPACE\desktop\target" >> $env:GITHUB_ENV
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target.nosync
      - run: npm ci
      - run: npx vite build
      # Lo que trae esta versión (desktop/novedades.md): va en la página de la versión y lo muestra la
      # app en "Versión nueva".
      - id: notas
        shell: bash
        run: |
          { echo 'texto<<FIN_NOVEDADES'; cat desktop/novedades.md; echo 'FIN_NOVEDADES'; } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: desktop/src-tauri
          tauriScript: npx tauri
          # Sin etiqueta (corrido a mano) solo arma, no publica nada.
          tagName: ${{ github.event_name == 'push' && 'escritorio-v__VERSION__' || '' }}
          releaseName: MIO para escritorio __VERSION__
          releaseBody: ${{ steps.notas.outputs.texto }}
          releaseDraft: true
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: |
            desktop/target*/release/bundle/dmg/*.dmg
            desktop/target*/release/bundle/nsis/*.exe
          if-no-files-found: error
