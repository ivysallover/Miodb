name: Verify dashboard

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-ia/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-ia/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard-ia/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Avisos de seguridad conocidos en lo que usa la app de escritorio (Rust) y la web (npm).
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: desktop
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Las "altas" que quedan vienen dentro de Firebase y no afectan en el navegador (ver CLAUDE.md).
      - run: npm audit --omit=dev --audit-level=critical
