[package]
name = "mio-desktop"
version = "0.1.0"
edition = "2021"
description = "MIO de escritorio: la ventana (Tauri) y el puente con el motor en Rust."
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
mio-engine = { path = "../engine" }
serde = { version = "1.0.229", features = ["derive"] }
rustc-hash = "2.1.3"
tauri-plugin-opener = "2"
rand = "0.8"
tiny_http = "0.12"
base64 = "0.22"

[features]
# La app con las pantallas adentro (las de `dist`, armadas con `npm run build`) en lugar de pedirlas al
# servidor de desarrollo: es como se compila para usar de verdad (`npm run escritorio`).
custom-protocol = ["tauri/custom-protocol"]
