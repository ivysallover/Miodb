[workspace]
resolver = "2"
members = ["engine", "src-tauri"]

# Las pruebas no necesitan la información de depuración de las dependencias (era casi todo el peso);
# la nuestra queda con los números de línea, que alcanzan para saber dónde falló algo.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Una cuenta que se pasa del tamaño de un número corta con un error en lugar de dar la vuelta en silencio:
# mejor "no pude" que un número equivocado.
overflow-checks = true
