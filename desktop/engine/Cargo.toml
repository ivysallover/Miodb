[package]
name = "mio-engine"
version = "0.1.0"
edition = "2021"
description = "Motor de análisis de MIO, en Rust: el mismo resultado que el motor de Python, sin Python."
publish = false

[dependencies]
# LightGBM compilado dentro del programa (sin OpenMP: un hilo, resultados fijos, sin libomp).
lightgbm3-sys = { version = "=1.0.11", default-features = false }
serde_json = "1"
csv = "1"
encoding_rs = "0.8"
regex = "1"
unicode-normalization = "0.1"

[dev-dependencies]
serde_json = "1"
