[package]
name = "mio-engine"
version = "0.1.0"
edition = "2021"
description = "Motor de análisis de MIO, en Rust: el mismo resultado que el motor de Python, sin Python."
publish = false

[dependencies]
# LightGBM compilado dentro del programa (sin OpenMP: un hilo, resultados fijos, sin libomp).
lightgbm3-sys = { version = "=1.0.11", default-features = false }
serde_json = "1"
csv = "1"
encoding_rs = "0.8"
regex = "1"
unicode-normalization = "0.1"
calamine = { version = "0.37", features = ["chrono"] }
encoding_rs_io = "0.1.8"
rustc-hash = "2.1.3"
rayon = "1.12.0"
rand = { version = "0.8", default-features = false, features = ["alloc"] }
rand_chacha = { version = "0.3", default-features = false }
